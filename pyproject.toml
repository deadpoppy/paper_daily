[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-daily"
version = "0.1.0"
description = "Daily AI paper recommender: multi-source search, dedup, rank, review, and archive"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
    "arxiv>=2.0.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
arxiv2md = "arxiv2md.__main__:main"
paper-daily = "paper_daily.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_daily", "src/arxiv2md"]
