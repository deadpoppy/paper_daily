<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="12" fill="url(#bg)"/>

  <!-- Decorative grid dots -->
  <g opacity="0.08" fill="#94a3b8">
    <circle cx="50" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/><circle cx="200" cy="50" r="2"/><circle cx="250" cy="50" r="2"/><circle cx="300" cy="50" r="2"/><circle cx="350" cy="50" r="2"/><circle cx="400" cy="50" r="2"/><circle cx="450" cy="50" r="2"/><circle cx="500" cy="50" r="2"/><circle cx="550" cy="50" r="2"/><circle cx="600" cy="50" r="2"/><circle cx="650" cy="50" r="2"/><circle cx="700" cy="50" r="2"/><circle cx="750" cy="50" r="2"/><circle cx="800" cy="50" r="2"/><circle cx="850" cy="50" r="2"/>
    <circle cx="50" cy="100" r="2"/><circle cx="100" cy="100" r="2"/><circle cx="150" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="250" cy="100" r="2"/><circle cx="300" cy="100" r="2"/><circle cx="350" cy="100" r="2"/><circle cx="400" cy="100" r="2"/><circle cx="450" cy="100" r="2"/><circle cx="500" cy="100" r="2"/><circle cx="550" cy="100" r="2"/><circle cx="600" cy="100" r="2"/><circle cx="650" cy="100" r="2"/><circle cx="700" cy="100" r="2"/><circle cx="750" cy="100" r="2"/><circle cx="800" cy="100" r="2"/><circle cx="850" cy="100" r="2"/>
    <circle cx="50" cy="150" r="2"/><circle cx="100" cy="150" r="2"/><circle cx="150" cy="150" r="2"/><circle cx="200" cy="150" r="2"/><circle cx="250" cy="150" r="2"/><circle cx="300" cy="150" r="2"/><circle cx="350" cy="150" r="2"/><circle cx="400" cy="150" r="2"/><circle cx="450" cy="150" r="2"/><circle cx="500" cy="150" r="2"/><circle cx="550" cy="150" r="2"/><circle cx="600" cy="150" r="2"/><circle cx="650" cy="150" r="2"/><circle cx="700" cy="150" r="2"/><circle cx="750" cy="150" r="2"/><circle cx="800" cy="150" r="2"/><circle cx="850" cy="150" r="2"/>
    <circle cx="50" cy="200" r="2"/><circle cx="100" cy="200" r="2"/><circle cx="150" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="250" cy="200" r="2"/><circle cx="300" cy="200" r="2"/><circle cx="350" cy="200" r="2"/><circle cx="400" cy="200" r="2"/><circle cx="450" cy="200" r="2"/><circle cx="500" cy="200" r="2"/><circle cx="550" cy="200" r="2"/><circle cx="600" cy="200" r="2"/><circle cx="650" cy="200" r="2"/><circle cx="700" cy="200" r="2"/><circle cx="750" cy="200" r="2"/><circle cx="800" cy="200" r="2"/><circle cx="850" cy="200" r="2"/>
    <circle cx="50" cy="250" r="2"/><circle cx="100" cy="250" r="2"/><circle cx="150" cy="250" r="2"/><circle cx="200" cy="250" r="2"/><circle cx="250" cy="250" r="2"/><circle cx="300" cy="250" r="2"/><circle cx="350" cy="250" r="2"/><circle cx="400" cy="250" r="2"/><circle cx="450" cy="250" r="2"/><circle cx="500" cy="250" r="2"/><circle cx="550" cy="250" r="2"/><circle cx="600" cy="250" r="2"/><circle cx="650" cy="250" r="2"/><circle cx="700" cy="250" r="2"/><circle cx="750" cy="250" r="2"/><circle cx="800" cy="250" r="2"/><circle cx="850" cy="250" r="2"/>
  </g>

  <!-- Left icon: open book -->
  <g transform="translate(60, 85)">
    <path d="M0 80 Q30 60 60 70 L60 0 Q30 -10 0 10 Z" fill="url(#accent)" opacity="0.9"/>
    <path d="M60 0 Q90 -10 120 10 L120 80 Q90 60 60 70 Z" fill="url(#teal)" opacity="0.9"/>
    <line x1="60" y1="0" x2="60" y2="70" stroke="#0f172a" stroke-width="1.5" opacity="0.3"/>
    <!-- sparkles -->
    <circle cx="30" cy="-20" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="90" cy="-25" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="60" cy="-35" r="5" fill="#fbbf24" opacity="0.7"/>
    <line x1="60" y1="-42" x2="60" y2="-48" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
    <line x1="53" y1="-35" x2="47" y2="-35" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
    <line x1="73" y1="-35" x2="79" y2="-35" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="210" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">
    Paper Daily
  </text>

  <!-- Subtitle -->
  <text x="212" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#94a3b8" font-weight="400">
    Daily AI Paper Discovery &amp; Ranking
  </text>

  <!-- Tags row -->
  <g transform="translate(210, 180)">
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#6366f1" opacity="0.15"/>
    <text x="55" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a5b4fc" text-anchor="middle" font-weight="600">5 Sources</text>

    <rect x="120" y="0" width="110" height="28" rx="14" fill="#14b8a6" opacity="0.15"/>
    <text x="175" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5eead4" text-anchor="middle" font-weight="600">5D Ranking</text>

    <rect x="240" y="0" width="120" height="28" rx="14" fill="#f59e0b" opacity="0.15"/>
    <text x="300" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fcd34d" text-anchor="middle" font-weight="600">LLM Review</text>

    <rect x="370" y="0" width="130" height="28" rx="14" fill="#ef4444" opacity="0.15"/>
    <text x="435" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fca5a5" text-anchor="middle" font-weight="600">14 AI Domains</text>
  </g>

  <!-- Pipeline visualization -->
  <g transform="translate(210, 228)">
    <!-- Source nodes -->
    <rect x="0" y="0" width="60" height="24" rx="4" fill="#6366f1" opacity="0.25" stroke="#6366f1" stroke-width="1"/>
    <text x="30" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">arXiv</text>

    <rect x="70" y="0" width="60" height="24" rx="4" fill="#6366f1" opacity="0.25" stroke="#6366f1" stroke-width="1"/>
    <text x="100" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">OpenAlex</text>

    <rect x="140" y="0" width="60" height="24" rx="4" fill="#6366f1" opacity="0.25" stroke="#6366f1" stroke-width="1"/>
    <text x="170" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#c7d2fe" text-anchor="middle">S2</text>

    <!-- Arrow -->
    <line x1="210" y1="12" x2="240" y2="12" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Dedup -->
    <rect x="248" y="0" width="60" height="24" rx="4" fill="#14b8a6" opacity="0.25" stroke="#14b8a6" stroke-width="1"/>
    <text x="278" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#99f6e4" text-anchor="middle">Dedup</text>

    <!-- Arrow -->
    <line x1="318" y1="12" x2="348" y2="12" stroke="#475569" stroke-width="1.5"/>

    <!-- Rank -->
    <rect x="356" y="0" width="60" height="24" rx="4" fill="#f59e0b" opacity="0.25" stroke="#f59e0b" stroke-width="1"/>
    <text x="386" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">Rank</text>

    <!-- Arrow -->
    <line x1="426" y1="12" x2="456" y2="12" stroke="#475569" stroke-width="1.5"/>

    <!-- Output -->
    <rect x="464" y="0" width="60" height="24" rx="4" fill="#ef4444" opacity="0.25" stroke="#ef4444" stroke-width="1"/>
    <text x="494" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#fecaca" text-anchor="middle">Top N</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Version badge -->
  <g transform="translate(780, 20)">
    <rect x="0" y="0" width="80" height="26" rx="13" fill="url(#accent)" opacity="0.2" stroke="#6366f1" stroke-width="1"/>
    <text x="40" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#c7d2fe" text-anchor="middle" font-weight="600">v0.1.0</text>
  </g>
</svg>
